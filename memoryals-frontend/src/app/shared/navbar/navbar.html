<nav>
  <div class="nav-container">

    <!-- Logo -->
    <div class="logo">
      <a routerLink="/inicio">
        <img src="/logo.png" alt="Memoryals Logo">
      </a>
    </div>

    <!-- Menú toggle (mobile) -->
    <div class="menu-toggle" id="menu-toggle" (click)="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <!-- Links + Login/Usuario -->
    <div class="nav-right" [class.show]="isMenuOpen">
      <div class="nav-links">
  <a routerLink="/inicio" routerLinkActive="active">Inicio</a>
  <a routerLink="/planes" routerLinkActive="active">Planes</a>
  <a routerLink="/sobre-nosotros" routerLinkActive="active">Sobre Nosotros</a>
      </div>

      <!-- Si NO hay usuario -->
      <div class="nav-actions" *ngIf="!user">
        <a routerLink="/login" routerLinkActive="active" class="btn-login">Login</a>
      </div>

      <!-- Si HAY usuario -->
      <div class="nav-actions user-dropdown" *ngIf="user">
        <button class="user-btn" (click)="toggleDropdown()">
          👤 {{ user.nombre }}
          <span class="arrow" [class.open]="isDropdownOpen">▼</span>
        </button>
        <ul class="dropdown-menu" [class.show]="isDropdownOpen">
          <!-- Enviamos el id del usuario en la ruta -->
          <li><a [routerLink]="['/mi-cuenta', user._id]">Mi cuenta</a></li>
          <li><a (click)="logout()">Salir</a></li>
        </ul>
      </div>
    </div>

  </div>
</nav>
