<!-- Botón flotante (solo si hay usuario logueado) -->
<button
  *ngIf="user"
  class="chat-button"
  (click)="toggleChat()"
  aria-label="Abrir chat de asistencia"
>
  💬
</button>

<!-- Ventana de chat -->
<section class="chat-window" *ngIf="isOpen && user" aria-live="polite">
  <header class="chat-header">
    <h2>Asistente Memoryals</h2>
    <div class="chat-actions">
      <button
        (click)="borrarHistorial()"
        aria-label="Borrar historial de chat"
        title="Borrar historial"
      >
        🗑️
      </button>
      <button
        (click)="toggleChat()"
        aria-label="Cerrar chat"
        title="Cerrar chat"
      >
        ✖
      </button>
    </div>
  </header>

  <main class="chat-messages">
    <div
      *ngFor="let msg of messages"
      [ngClass]="msg.role"
      class="chat-message"
    >
      <span class="message-text">{{ msg.content }}</span>
      <small class="timestamp" *ngIf="msg.timestamp">
        {{ msg.timestamp | date:'short' }}
      </small>
    </div>

    <div *ngIf="loading" class="assistant typing">Escribiendo...</div>
  </main>

  <footer class="chat-input">
    <input
      [(ngModel)]="newMessage"
      (keydown.enter)="sendMessage()"
      placeholder="Escribe tu mensaje..."
      aria-label="Mensaje para el asistente"
    />
    <button
      (click)="sendMessage()"
      aria-label="Enviar mensaje"
      title="Enviar mensaje"
    >
      ➤
    </button>
  </footer>
</section>
