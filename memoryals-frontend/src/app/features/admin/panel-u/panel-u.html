<div class="profile-page">
  <div class="profile-card">
    <h2 class="section-title">Panel de Usuarios</h2>

    <div *ngIf="loading" class="spinner"></div>
    <div *ngIf="error" class="alert error">{{ error }}</div>

    <!-- Filtro -->
    <div class="filter-container">
      <input
        type="text"
        placeholder="Filtrar por nombre"
        [(ngModel)]="filtroNombre"
        (input)="aplicarFiltro()"
      />
    </div>

    <!-- Tabla de usuarios filtrados -->
    <table *ngIf="usuariosFiltrados.length" class="table-users">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Email</th>
          <th>Rol</th>
          <th>DNI</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let usuario of usuariosFiltrados">
          <td>{{ usuario.nombre }}</td>
          <td>{{ usuario.email }}</td>
          <td>{{ usuario.rol }}</td>
          <td>{{ usuario.dni }}</td>
          <td>{{ usuario.estado || 'pendiente' }}</td>
          <td class="acciones">
            <button class="btn secondary" (click)="editarUsuario(usuario)">Editar</button>
            <button class="btn secondary" (click)="eliminarUsuario(usuario._id)">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- Mensaje si no hay usuarios -->
    <div *ngIf="!loading && usuariosFiltrados.length === 0" class="alert">
      No hay usuarios registrados
    </div>
  </div>

  <!-- Modal Editar Usuario -->
  <div class="modal" [class.show]="modalVisible">
    <div class="modal-content">
      <h3>Editar Usuario</h3>
      <div class="form-group">
        <label>Nombre</label>
        <input [(ngModel)]="usuarioSeleccionado.nombre" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input [(ngModel)]="usuarioSeleccionado.email" />
      </div>
      <div class="form-group">
        <label>Rol</label>
        <select [(ngModel)]="usuarioSeleccionado.rol">
          <option value="cliente">Cliente</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <div class="form-group">
        <label>Estado</label>
        <select [(ngModel)]="usuarioSeleccionado.estado">
          <option value="activo">Activo</option>
          <option value="pendiente">Pendiente</option>
          <option value="inactivo">Inactivo</option>
        </select>
      </div>

      <div class="modal-actions">
        <button class="btn primary" (click)="guardarUsuario()">Guardar</button>
        <button class="btn secondary" (click)="cerrarModal()">Cancelar</button>
      </div>
    </div>
  </div>
</div>
