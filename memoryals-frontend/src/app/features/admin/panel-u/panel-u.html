<div class="panel-container">
  <h2 class="panel-title">Panel de Usuarios</h2>

  <div *ngIf="loading" class="spinner"></div>
  <div *ngIf="error" class="alert error">{{ error }}</div>

  <div *ngIf="usuarios.length" class="table-wrapper">
    <table class="data-table">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Email</th>
          <th>Rol</th>
          <th>DNI</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let usuario of usuarios">
          <td>{{ usuario.nombre }}</td>
          <td>{{ usuario.email }}</td>
          <td>{{ usuario.rol }}</td>
          <td>{{ usuario.dni }}</td>
          <td>{{ usuario.estado || 'pendiente' }}</td>
          <td class="actions">
            <button class="btn btn-secondary" (click)="editarUsuario(usuario)">Editar</button>
            <button class="btn btn-secondary" (click)="eliminarUsuario(usuario._id)">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="!loading && usuarios.length === 0" class="alert">
    No hay usuarios registrados
  </div>
</div>

<!-- Modal Editar Usuario -->
<div class="modal-overlay" [class.show]="modalVisible">
  <div class="modal-content">
    <h3>Editar Usuario</h3>
    <div class="form-group">
      <label>Nombre</label>
      <input [(ngModel)]="usuarioSeleccionado.nombre" />
    </div>
    <div class="form-group">
      <label>Email</label>
      <input [(ngModel)]="usuarioSeleccionado.email" />
    </div>
    <div class="form-group">
      <label>Rol</label>
      <select [(ngModel)]="usuarioSeleccionado.rol">
        <option value="cliente">Cliente</option>
        <option value="admin">Admin</option>
      </select>
    </div>
    <div class="form-group">
      <label>Estado</label>
      <select [(ngModel)]="usuarioSeleccionado.estado">
        <option value="activo">Activo</option>
        <option value="pendiente">Pendiente</option>
        <option value="inactivo">Inactivo</option>
      </select>
    </div>

    <div class="modal-actions">
      <button class="btn btn-secondary" (click)="cerrarModal()">Cancelar</button>
      <button class="btn btn-primary" (click)="guardarUsuario()">Guardar</button>
    </div>
  </div>
</div>
