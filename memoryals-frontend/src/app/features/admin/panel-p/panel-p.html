<div class="profile-page">
  <div class="profile-card">
    <h2 class="section-title">Panel de Pagos</h2>

    <!-- Spinner de carga -->
    <div *ngIf="loading" class="spinner"></div>

    <!-- Mensaje de error -->
    <div *ngIf="error" class="alert error">{{ error }}</div>

    <!-- Filtro por usuario -->
    <div class="filter-container">
      <input
        type="text"
        placeholder="Filtrar por usuario"
        [(ngModel)]="filtroUsuario"
        (input)="aplicarFiltro()"
      />
    </div>

    <!-- Tabla de pagos con scroll horizontal -->
    <div class="table-wrapper">
      <table *ngIf="pagosFiltrados.length > 0" class="table-users">
        <thead>
          <tr>
            <th>Usuario</th>
            <th>Plan</th>
            <th>Mes/Año</th>
            <th>Monto</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let pago of pagosFiltrados">
            <td>{{ pago.usuario?.nombre || '-' }}</td>
            <td>{{ pago.plan?.nombre || '-' }}</td>
            <td>{{ pago.mes }}/{{ pago.anio }}</td>
            <td>{{ pago.monto | currency:'ARS' }}</td>
            <td>{{ pago.estado }}</td>
            <td class="actions">
              <button class="btn secondary" (click)="editarPago(pago)">Editar</button>
              <button class="btn secondary" (click)="eliminarPago(pago._id)">Eliminar</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Mensaje si no hay pagos -->
    <div *ngIf="!loading && pagosFiltrados.length === 0" class="alert">
      No hay pagos registrados
    </div>
  </div>
</div>

<!-- Modal de edición -->
<div class="modal" [class.show]="modalVisible" *ngIf="pagoSeleccionado">
  <div class="modal-content">
    <h3>Editar Pago</h3>

    <div class="form-group">
      <label>Estado:</label>
      <select [(ngModel)]="pagoSeleccionado.estado">
        <option value="pendiente">Pendiente</option>
        <option value="pagada">Pagada</option>
        <option value="rechazada">Rechazada</option>
      </select>
    </div>

    <div class="form-group">
      <label>Método de Pago:</label>
      <input [(ngModel)]="pagoSeleccionado.metodoPago" type="text" />
    </div>

    <div class="modal-actions">
      <button class="btn secondary" (click)="cerrarModal()">Cancelar</button>
      <button class="btn primary" (click)="guardarPago()">Guardar</button>
    </div>
  </div>
</div>
